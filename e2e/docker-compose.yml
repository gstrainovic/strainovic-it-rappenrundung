name: rappenrundung-e2e
# Echte WordPress-Umgebung mit WooCommerce: docker compose up -d, dann ./e2e.sh
services:
  db:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: wp, MARIADB_USER: wp, MARIADB_PASSWORD: wp }
  wp:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports: ["8093:80"]
    environment: { WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wp, WORDPRESS_DB_PASSWORD: wp, WORDPRESS_DB_NAME: wp }
    volumes:
      - wp:/var/www/html
      - ../plugin/strainovic-it-rappenrundung:/var/www/html/wp-content/plugins/strainovic-it-rappenrundung:ro
      - ./mu:/var/www/html/wp-content/mu-plugins:ro
  cli:
    image: wordpress:cli-php8.3
    depends_on: [wp]
    user: "33:33"
    environment: { WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wp, WORDPRESS_DB_PASSWORD: wp, WORDPRESS_DB_NAME: wp, HOME: /tmp }
    volumes:
      - wp:/var/www/html
      - ../plugin/strainovic-it-rappenrundung:/var/www/html/wp-content/plugins/strainovic-it-rappenrundung:ro
      - ./mu:/var/www/html/wp-content/mu-plugins:ro
      # Übersetzungen kommen im Betrieb als Sprachpaket von translate.wordpress.org; e2e.sh legt sie dorthin, wo WordPress sie sucht
      - ../translations:/translations:ro
    entrypoint: ["sleep", "infinity"]
volumes:
  wp:
